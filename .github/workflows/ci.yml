name: CI

on:
  push:
    branches: [develop, main]
  # No base filter: stacked PRs (feature → feature) must be checked too.
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run ci:check
